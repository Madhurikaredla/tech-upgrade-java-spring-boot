# ── Auth errors ──────────────────────────────────────────────────────────────
error.auth.userNotFound=User not found.
error.auth.invalidCredentials=Invalid email or password.
error.auth.tokenExpired=Your session has expired. Please log in again.
error.auth.tokenInvalid=The provided authentication token is invalid.
error.auth.emailAlreadyExists=An account with this email address already exists.
error.auth.unauthorized=Authentication is required to access this resource.
error.auth.forbidden=You do not have permission to perform this action.

# ── Expense errors ────────────────────────────────────────────────────────────
error.expense.notFound=The requested expense was not found.
error.expense.invalidAmount=The expense amount must be greater than zero.
error.expense.dateInvalid=The expense date cannot be in the future.
error.expense.categoryRequired=At least one category must be provided for an expense.
error.expense.accessDenied=You do not have access to this expense.

# ── Category errors ───────────────────────────────────────────────────────────
error.category.notFound=The requested category was not found.
error.category.nameDuplicate=A category with this name already exists.
error.category.accessDenied=You do not have access to this category.
error.category.keyDuplicate=A category with this key already exists.

# ── Validation errors ─────────────────────────────────────────────────────────
error.validation.failed=Request validation failed.
error.validation.fieldRequired=A required field is missing.
error.validation.fieldSizeExceeded=A field value exceeds the maximum allowed length.
error.validation.invalidFormat=invalid format.

# ── Database errors ───────────────────────────────────────────────────────────
error.db.generic=A database error occurred. Please try again later.
error.db.constraintViolation=The operation violates a data integrity constraint.
error.db.duplicateEntry=A duplicate record already exists.
error.db.connectionFailed=Unable to connect to the database. Please try again later.

# ── System errors ─────────────────────────────────────────────────────────────
error.system.internalError=An unexpected error occurred. Please try again later.
error.system.serviceUnavailable=The service is temporarily unavailable. Please try again later.
error.system.rateLimitExceeded=Too many requests. Please slow down and try again.

