# ============================================================
# application.properties - Base configuration for Expense Tracker  
# ============================================================

# Application name
spring.application.name=expense-tracker

# -- Server Port
server.port=5894

# ── Database Configuration ────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/expense_tracker
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

# ── HikariCP Connection Pool ──────────────────────────────
spring.datasource.hikari.pool-name=ExpenseTrackerHikariPool
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# ── JPA Configuration ────────────────────────────────────
# NEVER use create/update/create-drop in any non-test profile
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ── Flyway Configuration ─────────────────────────────────
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=true

# ── Logging Configuration ────────────────────────────────
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.com.expensetracker=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n
logging.file.name=logs/expensetracker.log

# ── Jackson Configuration ────────────────────────────────
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# ── JWT Configuration ────────────────────────────────────
# WARNING: For local/dev only! Do NOT commit real secrets to version control or use in production.
JWT_SECRET=sXSJshFGKGERIsgftdgwyasdSfhywesESrtyweshdgw
app.jwt.access-token-expiry-ms=900000
app.jwt.refresh-token-expiry-ms=604800000

# ── Actuator Configuration ───────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# ── Springdoc/Swagger Configuration ──────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
